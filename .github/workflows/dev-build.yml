name: dev-build

# Dev channel — continuous deployment of the release branch.
# https://github.com/tibrezus/harmostes/issues/201
#
# Fires on pushes to rezus/forgejo-16 (sync.yml merges + PR merges).
# Builds 16.0.2-dev.NNNNNN (immutable, zero-padded run number: lexical ==
# numeric; the Flux ImagePolicy orders on it) + 16.0.2-dev-<sha8>
# (addressable) + dev-16 / dev (mutable). Prod rolls on this channel.
# Multi-arch: prod runs on the arm64 OCI control-plane by design.
# NEVER cuts tags; stable artifacts stay tag-triggered (release.yml).

on:
  push:
    branches: [rezus/forgejo-16]
  workflow_dispatch: {}

concurrency:
  group: dev-build-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  dev-image:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, fetch-tags: true }

      - name: Derive channel identity
        id: meta
        env:
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHORT_SHA="${SHA:0:8}"
          # Single mapping row = the release line; identity = highest pure
          # vX.Y.Z on the release-line prefix, from the upstream host.
          TAG_PREFIX="v${BRANCH#rezus/forgejo-}.0"
          VER=$(git ls-remote --tags https://codeberg.org/forgejo/forgejo.git "refs/tags/${TAG_PREFIX}.*" \
            | awk -F/ '{print $NF}' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -F "${TAG_PREFIX}." | sort -V | tail -1)
          [ -z "$VER" ] && { echo "ERROR: no upstream ${TAG_PREFIX}.* release tag"; exit 1; }
          VERSION="${VER#v}+dev.${SHORT_SHA}"
          IMMUTABLE="${VER#v}-dev-${SHORT_SHA}"
          MUTABLES="dev-${TAG_PREFIX#v} dev"
          
          # ORDER tag: zero-padded run number → fixed-width lexical order
          # equals numeric order; Flux ImagePolicy(alphabetical, tagFilter
          # ^<ver>-dev\.\d{6}$) picks the latest build
          # deterministically. Immutable sha tag stays for addressability.
          PADDED=$(printf '%06d' "${GITHUB_RUN_NUMBER}")
          ORDER="${VER#v}-dev.${PADDED}"
          TAGS="${REPO}:${IMMUTABLE} ${REPO}:${ORDER}"
          for m in $MUTABLES; do TAGS="${TAGS} ${REPO}:${m}"; done
          {
            echo "version=${VERSION}"
            echo "tags<<EOF"
            for t in $TAGS; do echo "$t"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3   # arm64 stage needs binfmt emulation (multi-arch -16 builds)
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write VERSION (upstream identity + dev provenance)
        run: printf '%s\n' "${{ steps.meta.outputs.version }}" > VERSION

      # -16 → rootful Dockerfile, MULTI-ARCH (prod lives on the arm64
      # control-plane by design — juicefs-valkey co-location); -next →
      # rootless amd64 (canary is placed on an amd64 worker).
      - name: Build & push dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            RELEASE_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=forgejo (rezuscloud dev channel)
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          # NO gha build cache: cross-platform cache pollution executes
          # amd64-cached go-generate tools under the emulated arm64 stage
          # ("fork/exec ... exec format error" — release.yml builds cache-less
          # for the same reason).
          cache-from: ''
          cache-to: 
