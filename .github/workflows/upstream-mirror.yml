name: upstream-mirror

# Mirrors all Forgejo-era upstream release branches (v7.0+/forgejo) from Codeberg
# to this fork. When Forgejo publishes a new major release (v17.0/forgejo,
# v18.0/forgejo, ...), this Action automatically discovers and mirrors it —
# no reconfiguration needed.
#
# Each branch that changes fires a push event → harmostes webhook → fork-sync.
# The harmostes Workflow CR's branch filter determines which version is actively
# synced. Upgrading to a new major version = changing that filter, not this Action.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror Forgejo-era release branches (v7.0+)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch ALL release branches + main from Codeberg.
          # main/forgejo mirrors upstream development head (branch 'forgejo')
          # for the dev-next channel: rezus/forgejo-next = main + our delta,
          # merged by the harmostes forgejo-next workflow — cross-major
          # pre-flight ahead of every major transition.
          git remote add upstream https://codeberg.org/forgejo/forgejo.git
          git fetch upstream '+refs/heads/v*/forgejo:refs/remotes/upstream/v*/forgejo' '+refs/heads/forgejo:refs/remotes/upstream/forgejo'

          CHANGED=false

          # dev-next mirror: upstream main → main/forgejo (same change-detection)
          UPSTREAM_MAIN_SHA=$(git rev-parse refs/remotes/upstream/forgejo)
          MAIN_CURRENT=$(git ls-remote origin "refs/heads/main/forgejo" | awk '{print $1}')
          [ -z "$MAIN_CURRENT" ] && MAIN_CURRENT="(new)"
          if [ "$UPSTREAM_MAIN_SHA" = "$MAIN_CURRENT" ]; then
            echo "  ✓ main/forgejo: up to date"
          else
            echo "  ↻ main/forgejo: $MAIN_CURRENT → ${UPSTREAM_MAIN_SHA:0:12}"
            git push origin "refs/remotes/upstream/forgejo:refs/heads/main/forgejo" --force
            CHANGED=true
          fi

          for ref in $(git for-each-ref --format='%(refname:short)' 'refs/remotes/upstream/v*/forgejo' | sort -V); do
            branch="${ref#upstream/}"

            # Skip Gitea-era branches (v1.x) — Forgejo starts at v7.0
            major=$(echo "$branch" | sed 's/v\([0-9]*\)\..*/\1/')
            if [ "$major" -lt 7 ]; then
              continue
            fi

            upstream_sha=$(git rev-parse "$ref")
            current_sha=$(git ls-remote origin "refs/heads/$branch" | awk '{print $1}')
            [ -z "$current_sha" ] && current_sha="(new)"

            if [ "$upstream_sha" = "$current_sha" ]; then
              echo "  ✓ $branch: up to date"
              continue
            fi

            echo "  ↻ $branch: $current_sha → ${upstream_sha:0:12}"
            git push origin "$ref:refs/heads/$branch" --force
            CHANGED=true
          done

          echo ""
          if [ "$CHANGED" = "true" ]; then
            echo "Mirror updated — GitHub fired push webhooks for changed branches"
          else
            echo "All release branches up to date — no webhooks fired"
          fi
