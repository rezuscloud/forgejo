name: upstream-mirror

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror upstream v16.0/forgejo branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Query the current mirror HEAD directly from the remote (no local fetch needed)
          CURRENT=$(git ls-remote origin refs/heads/v16.0/forgejo | awk '{print $1}')
          if [ -z "$CURRENT" ]; then
            CURRENT="none"
          fi

          # Fetch the upstream release branch from Codeberg
          git remote add upstream https://codeberg.org/forgejo/forgejo.git
          git fetch upstream v16.0/forgejo
          UPSTREAM=$(git rev-parse upstream/v16.0/forgejo)

          echo "Current mirror HEAD: $CURRENT"
          echo "Upstream HEAD:       $UPSTREAM"

          if [ "$CURRENT" = "$UPSTREAM" ]; then
            echo "✓ Already up to date — no push, no webhook"
            exit 0
          fi

          echo "↻ Upstream has new commits — pushing to mirror branch"
          git push origin refs/remotes/upstream/v16.0/forgejo:refs/heads/v16.0/forgejo --force
          echo "✓ Mirror updated — GitHub fires a push webhook"
