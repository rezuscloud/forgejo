# Builds a custom rootless container image of Forgejo from the upstream
# `forgejo` branch (codeberg.org/forgejo/forgejo main).
#
# Why: Forgejo v15 (the latest released line) does not expose Actions job/run
# logs over the REST API (PR forgejo/forgejo#12666 is merged on `forgejo`
# ahead of the v16.0.0 release). This image lets us run that unreleased code so
# `fj` / the API can read CI logs. When upstream ships v16.0.0 + a matching
# helm chart (appVersion 16), this fork can be retired in favour of the
# upstream image.
name: release-image

on:
  push:
    branches: [forgejo]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref/SHA to build (defaults to the forgejo branch)"
        required: false
        default: forgejo

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'forgejo' }}
          fetch-depth: 0 # git describe needs tags/history for a truthful version

      - name: Compute image metadata
        id: meta
        run: |
          short_sha="$(git rev-parse --short=12 HEAD)"
          date_tag="$(date -u +%Y%m%d)"
          describe="$(git describe --tags --always 2>/dev/null || echo "dev-${short_sha}")"
          # RELEASE_VERSION embedded into the binary; surfaced by GET /api/v1/version.
          release_version="${describe#v}"
          {
            echo "short_sha=${short_sha}"
            echo "date_tag=${date_tag}"
            echo "release_version=${release_version}"
          } >> "$GITHUB_OUTPUT"
          echo "Building RELEASE_VERSION=${release_version} sha=${short_sha}"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only for now: the cluster's amd64 node is where Forgejo runs, and
      # we pin it there via nodeSelector in the helm values. To support the
      # arm64 node too, add "linux/arm64" to platforms (note: CGO sqlite via
      # QEMU is slow/fragile on the free runner).
      - name: Build & push rootless image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.rootless
          platforms: linux/amd64
          build-args: |
            RELEASE_VERSION=${{ steps.meta.outputs.release_version }}
          push: true
          tags: |
            ghcr.io/rezuscloud/forgejo:forgejo
            ghcr.io/rezuscloud/forgejo:dev
            ghcr.io/rezuscloud/forgejo:${{ steps.meta.outputs.short_sha }}
          labels: |
            org.opencontainers.image.title=forgejo (rezuscloud main build)
            org.opencontainers.image.source=https://github.com/rezuscloud/forgejo
            org.opencontainers.image.revision=${{ github.sha }}
